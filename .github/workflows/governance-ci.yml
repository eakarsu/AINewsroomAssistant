name: governed-workflow
on: [push, pull_request]
permissions: { contents: read }
jobs:
  dependency-free-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test backend/src/governance/*.test.cjs
      - run: find backend/src/governance -type f \\( -name '*.js' -o -name '*.cjs' \\) -print0 | xargs -0 -n1 node --check
      - run: node --check backend/src/server.js && node --check backend/src/middleware/auth.js && node --check backend/src/routes/auth.js
      - run: bash -n start.sh
